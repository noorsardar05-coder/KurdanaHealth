  <body>
    <!--
      Pre-React crawlable markup: React replaces #root on mount.
      Keeps HashRouter intact while giving search engines brand/founder text in the HTML.
    -->
    <div id="root">
      <header>
        <h1>KurdanaHealth</h1>

    </div>
    <noscript>
      <main style="max-width: 36rem; margin: 2rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #334155; line-height: 1.6;">
        <h1>KurdanaHealth</h1>

          KurdanaHealth is where health, medicine, science, AI, and the future come together as a
          lifestyle. Created by Noor Sardar Mustafa.
        </p>
        <p data-nosnippet>Please enable JavaScript to use KurdanaHealth.</p>
      </main>
    </noscript>
    <script>
      if (location.protocol === "file:") {
        document.getElementById("root").innerHTML =
          '<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:system-ui,sans-serif;background:#f8fafc;color:#334155;text-align:center"><div style="max-width:28rem"><h1 style="font-size:1.5rem;margin:0 0 .75rem">Start the dev server</h1><p style="margin:0;line-height:1.6">Do not open this file directly. In the project folder run <code style="background:#e2e8f0;padding:.15rem .4rem;border-radius:.35rem">npm install</code> then <code style="background:#e2e8f0;padding:.15rem .4rem;border-radius:.35rem">npm run dev</code> and open the localhost link.</p></div></main>';
      } else {
        // HashRouter: rewrite deep links like /dashboard to /#/dashboard (root-hosted custom domain).
        (function () {
          var hash = location.hash;
          if (hash && hash.length > 1) return;
          var path = location.pathname.replace(/\/index\.html$/i, "");
          var normalized = path.replace(/\/$/, "") || "";
          if (!normalized || normalized === "/") return;
          location.replace(location.origin + "/#" + normalized + location.search);
        })();
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
