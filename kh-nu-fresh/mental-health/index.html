<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSM — Mental Health &amp; Wellness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="softConfetti" aria-hidden="true"></canvas>
  <div class="bg-mesh" aria-hidden="true"></div>
  <div class="float-shape s1" aria-hidden="true"></div>
  <div class="float-shape s2" aria-hidden="true"></div>
  <div class="float-shape s3" aria-hidden="true"></div>

  <a href="#main" class="skip-link">Skip to content</a>

  <main class="shell" id="main">
    <div class="mh-page-nav glass">
      <a href="/dashboard" target="_top" id="backDashboard" class="mh-back-link" data-t="backDashboard"></a>
    </div>
    <header class="hero glass">
      <div class="topbar">
        <div class="brand-block">
          <p class="brand">NSM</p>
          <p class="brand-tag" data-t="brandTag"></p>
        </div>
        <button type="button" id="langToggle" class="chip lang-chip" aria-label="Switch language"></button>
      </div>
      <h1 data-t="heroTitle"></h1>
      <p class="subtitle" data-t="heroSubtitle"></p>
      <div class="quote-block">
        <button type="button" id="heroQuote" class="quote-nsm" aria-live="polite">
          <span id="quoteText"></span><span class="quote-sig"> — NSM</span>
        </button>
        <p class="hint" data-t="quoteHint"></p>
      </div>
      <p class="disclaimer-hero muted small" data-t="heroDisclaimer"></p>
    </header>

    <nav class="tabs glass" aria-label="Mental wellness sections">
      <button type="button" class="tab active" data-tab="explore" data-t="tabExplore"></button>
      <button type="button" class="tab" data-tab="learn" data-t="tabLearn"></button>
      <button type="button" class="tab" data-tab="tools" data-t="tabTools"></button>
      <button type="button" class="tab" data-tab="track" data-t="tabTrack"></button>
      <button type="button" class="tab" data-tab="discover" data-t="tabDiscover"></button>
    </nav>

    <!-- EXPLORE -->
    <section id="explore" class="panel active" aria-labelledby="explore-h">
      <div class="section-head">
        <h2 id="explore-h" class="section-title" data-t="exploreTitle"></h2>
        <p class="muted section-desc" data-t="exploreSub"></p>
      </div>

      <div class="grid-2">
        <article class="card glass">
          <h3 class="card-label" data-t="checkInTitle"></h3>
          <div id="checkInRoot"></div>
        </article>
        <article class="card glass">
          <h3 class="card-label" data-t="dashboardTitle"></h3>
          <div id="supportDashboard"></div>
        </article>
      </div>

      <div class="grid-2 mt">
        <article class="card glass quiz-card">
          <h3 class="card-label" data-t="quizTitle"></h3>
          <div class="progress quiz-progress"><span id="quizProgressBar"></span></div>
          <div id="quizRoot"></div>
          <div id="quizResult" class="quiz-result hidden"></div>
        </article>
        <article class="card glass">
          <h3 class="card-label" data-t="copingPathTitle"></h3>
          <div id="copingPath"></div>
          <div class="support-card mt" id="exploreSupportCard"></div>
        </article>
      </div>
    </section>

    <!-- LEARN -->
    <section id="learn" class="panel" aria-labelledby="learn-h">
      <div class="section-head">
        <h2 id="learn-h" class="section-title" data-t="learnTitle"></h2>
        <p class="muted section-desc" data-t="learnSub"></p>
      </div>
      <div class="learn-toolbar glass">
        <input type="search" id="learnSearch" class="search-input" autocomplete="off" />
        <div id="learnTopicList" class="topic-accordion"></div>
      </div>
    </section>

    <!-- TOOLS -->
    <section id="tools" class="panel" aria-labelledby="tools-h">
      <div class="section-head">
        <h2 id="tools-h" class="section-title" data-t="toolsTitle"></h2>
        <p class="muted section-desc" data-t="toolsSub"></p>
      </div>

      <div class="tools-grid">
        <article class="card glass tool-section">
          <h3 class="card-label" data-t="breathTitle"></h3>
          <div class="tool-tabs-inner" id="breathPicker"></div>
          <div id="breathTool"></div>
        </article>
        <article class="card glass tool-section">
          <h3 class="card-label" data-t="groundTitle"></h3>
          <div class="tool-tabs-inner" id="groundPicker"></div>
          <div id="groundTool"></div>
        </article>
        <article class="card glass tool-section wide">
          <h3 class="card-label" data-t="reframeTitle"></h3>
          <div id="reframeTool"></div>
        </article>
        <article class="card glass tool-section">
          <h3 class="card-label" data-t="journalTitle"></h3>
          <div id="journalTool"></div>
        </article>
        <article class="card glass tool-section">
          <h3 class="card-label" data-t="pmrTitle"></h3>
          <div id="pmrTool"></div>
        </article>
        <article class="card glass tool-section">
          <h3 class="card-label" data-t="needTitle"></h3>
          <div id="needTool"></div>
        </article>
        <article class="card glass tool-section">
          <h3 class="card-label" data-t="sootheTitle"></h3>
          <div id="sootheTool"></div>
        </article>
        <article class="card glass tool-section">
          <h3 class="card-label" data-t="firstAidTitle"></h3>
          <div id="firstAidTool"></div>
        </article>
        <article class="card glass tool-section wide crisis-card">
          <h3 class="card-label" data-t="crisisTitle"></h3>
          <div id="crisisNotice"></div>
        </article>
        <article class="card glass tool-section wide">
          <h3 class="card-label" data-t="burnoutMiniTitle"></h3>
          <div id="burnoutMini"></div>
        </article>
        <article class="card glass tool-section wide">
          <h3 class="card-label" data-t="boundaryTitle"></h3>
          <div id="boundaryTool"></div>
        </article>
        <article class="card glass tool-section wide">
          <h3 class="card-label" data-t="selfTalkTitle"></h3>
          <div id="selfTalkTool"></div>
        </article>
        <article class="card glass tool-section wide">
          <h3 class="card-label" data-t="nsResetTitle"></h3>
          <div id="nsResetTool"></div>
        </article>
        <article class="card glass tool-section wide">
          <h3 class="card-label" data-t="sleepGuideTitle"></h3>
          <div id="sleepGuideTool"></div>
        </article>
      </div>
    </section>

    <!-- TRACK -->
    <section id="track" class="panel" aria-labelledby="track-h">
      <div class="section-head">
        <h2 id="track-h" class="section-title" data-t="trackTitle"></h2>
        <p class="muted section-desc" data-t="trackSub"></p>
      </div>
      <div class="grid-2">
        <article class="card glass">
          <h3 class="card-label" data-t="logTodayTitle"></h3>
          <div id="trackerForm"></div>
          <button type="button" class="btn primary mt" id="saveLog" data-t="saveLog"></button>
        </article>
        <article class="card glass">
          <h3 class="card-label" data-t="insightsTitle"></h3>
          <div id="trackInsights"></div>
          <div class="wins-box mt" id="smallWins"></div>
        </article>
      </div>
      <article class="card glass mt">
        <h3 class="card-label" data-t="weeklyViewTitle"></h3>
        <div id="weeklyView"></div>
      </article>
    </section>

    <!-- DISCOVER -->
    <section id="discover" class="panel" aria-labelledby="discover-h">
      <div class="section-head">
        <h2 id="discover-h" class="section-title" data-t="discoverTitle"></h2>
        <p class="muted section-desc" data-t="discoverSub"></p>
      </div>
      <div class="discover-grid">
        <article class="card glass">
          <h3 class="card-label" data-t="reflectionTitle"></h3>
          <div id="reflectionCard"></div>
        </article>
        <article class="card glass">
          <h3 class="card-label" data-t="mythFactTitle"></h3>
          <div id="mythFactCard"></div>
        </article>
        <article class="card glass">
          <h3 class="card-label" data-t="compassionTitle"></h3>
          <div id="compassionCard"></div>
        </article>
        <article class="card glass">
          <h3 class="card-label" data-t="relationCheckTitle"></h3>
          <div id="relationCard"></div>
        </article>
        <article class="card glass wide">
          <h3 class="card-label" data-t="boundaryScriptsTitle"></h3>
          <div id="discoverBoundary"></div>
        </article>
        <article class="card glass">
          <h3 class="card-label" data-t="calmRoutineTitle"></h3>
          <div id="calmRoutine"></div>
        </article>
        <article class="card glass">
          <h3 class="card-label" data-t="supportPathsTitle"></h3>
          <div id="supportPaths"></div>
        </article>
        <article class="card glass wide">
          <h3 class="card-label" data-t="mediaTitle"></h3>
          <div id="mediaSuggestions"></div>
        </article>
        <article class="card glass wide">
          <h3 class="card-label" data-t="resetIdeasTitle"></h3>
          <div id="resetIdeas"></div>
        </article>
      </div>
    </section>

    <footer class="site-foot glass">
      <p class="small muted" data-t="footerNote"></p>
    </footer>
  </main>

  <div id="topicModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-inner glass">
      <button type="button" class="modal-close" id="closeModal" aria-label="Close">&times;</button>
      <h3 id="modalTitle"></h3>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
